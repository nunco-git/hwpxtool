<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글(HWPX) 간편도구 모음</title>
<!-- 보안 정책: 이 앱은 파일을 서버로 전송하지 않고 브라우저 안에서만 처리하므로
     connect-src를 'none'으로 막아 그 원칙을 브라우저 차원에서 강제한다.
     각 도구는 base64로 인코딩되어 이 파일 안에 내장되어 있으며, iframe(srcdoc)으로 실행된다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';">

<!-- 제목/본문에 쓰이는 Pretendard 폰트를 실제로 불러온다 -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" integrity="sha384-2nNKoOPayicGa+aRguOQuiZP+RqQ4G3jalfDeOgftkKD7zBM2gJXTwcFqCZltdv0">
<!-- 제목 전용 폰트: Jua (둥글고 귀여운 스타일) -->
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  button, .btn-reset, .top-col-title, .security-banner, .tool-list-container, .tool-panel, .tool-item {
    transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease,
                box-shadow 0.18s ease, transform 0.12s ease;
  }
  button:active { transform: scale(0.96); }
  body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 24px; color: #334155; }

  .app-container {
    display: grid;
    grid-template-columns: 1fr;
    gap: 30px;
    max-width: 1900px;
    width: 100%;
    margin: 0 auto;
    align-items: start;
    animation: app-fade-in 0.4s ease;
  }

  @keyframes app-fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .main-content {
    width: 100%;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    min-height: 88vh;
  }

  .top-section { flex: 0 0 20%; min-height: 150px; display: flex; align-items: stretch; gap: 14px; margin-bottom: 20px; }
  .top-col-title {
    flex: 0 0 22%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    text-align: center;
    background: linear-gradient(160deg, #fff7ed 0%, #ffedd5 100%);
    border: 1px solid #fed7aa; border-radius: 12px; padding: 14px 10px;
    box-shadow: 0 1px 3px rgba(194,65,12,0.06);
  }
  .top-col-title:hover { border-color: #fdba74; box-shadow: 0 6px 16px rgba(194,65,12,0.12); transform: translateY(-1px); }
  .title-icon { font-size: 2rem; line-height: 1; filter: drop-shadow(0 1px 1px rgba(194,65,12,0.15)); }
  .title-main { margin: 0; color: #9a3412; font-size: 1.8rem; font-weight: 400; font-family: 'Jua', 'Pretendard Variable', sans-serif; line-height: 1.25; letter-spacing: -0.1px; display: block; }
  .title-security-badge { background: #dcfce7; color: #166534; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; font-weight: 600; }
  .top-col-guide { flex: 1 1 78%; display: flex; min-width: 0; }
  .top-col-guide .security-banner { width: 100%; margin-bottom: 0; }

  h2 { margin: 0 0 4px 0; color: #0f172a; font-size: 1.5rem; display: flex; align-items: center; gap: 8px; }
  .subtitle { color: #64748b; font-size: 0.9rem; margin: 0 0 20px 0; }

  .security-banner {
    background: linear-gradient(180deg, #f0fdf4 0%, #ecfdf5 100%);
    border: 1px solid #bbf7d0;
    border-radius: 14px;
    padding: 16px 18px;
    color: #166534;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.55;
    margin-bottom: 18px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04), 0 1px 2px rgba(16, 24, 40, 0.03);
  }
  .security-banner:hover { border-color: #86efac; box-shadow: 0 6px 16px rgba(22,163,74,0.12); transform: translateY(-1px); }
  .security-banner-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .security-banner strong { font-size: 1rem; color: #15803d; letter-spacing: -0.2px; }

  .security-features { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .security-features li {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(187, 247, 208, 0.7);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.83rem;
  }
  .security-features .feat-icon {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    background: #16a34a; color: white; display: flex; align-items: center; justify-content: center;
    font-size: 13px; box-shadow: 0 2px 4px rgba(22, 163, 74, 0.25);
  }
  .security-features strong { display: inline; font-size: 0.83rem; margin: 0; color: #14532d; }
  .security-features .feat-desc { color: #15803d; font-weight: 700; }

  .tool-layout { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 20px; flex: 1 1 80%; min-height: 420px; }

  .tool-list-container { order: 2; flex: 0 0 230px; min-width: 200px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fafafa; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .tool-list-title { margin: 0 0 4px 0; font-size: 1rem; color: #0f172a; }
  .tool-list-hint { font-size: 0.78rem; color: #64748b; margin: 0 0 8px 0; }

  .tool-item {
    display: flex; align-items: center; gap: 10px;
    background: white; border: 1.5px solid #e2e8f0; border-radius: 10px;
    padding: 10px 12px; cursor: pointer; text-align: left;
  }
  .tool-item:hover { border-color: #93c5fd; box-shadow: 0 4px 12px rgba(37,99,235,0.1); transform: translateY(-1px); }
  .tool-item.active { border-color: #3b82f6; background: #eff6ff; box-shadow: 0 2px 6px rgba(37,99,235,0.15); }
  .tool-item .tool-icon { font-size: 1.5rem; flex-shrink: 0; }
  .tool-item .tool-info { min-width: 0; }
  .tool-item .tool-name { font-size: 0.92rem; font-weight: 700; color: #0f172a; }
  .tool-item .tool-desc { font-size: 0.76rem; color: #64748b; margin-top: 2px; line-height: 1.4; }

  .tool-cat-title { font-size: 0.8rem; font-weight: 800; color: #475569; margin: 10px 2px 6px; padding-bottom: 5px; border-bottom: 1px dashed #e2e8f0; }
  .tool-cat-title:first-child { margin-top: 0; }
  #tool-items { display: flex; flex-direction: column; gap: 10px; }
  .tool-item-placeholder {
    border: 1.5px dashed #e2e8f0; border-radius: 10px; padding: 14px;
    color: #94a3b8; font-size: 0.8rem; text-align: center; line-height: 1.6;
  }

  .tool-panel { flex: 1 1 auto; min-width: 0; border: 1px solid #e2e8f0; border-radius: 10px; background: #fafafa; overflow: hidden; display: flex; flex-direction: column; }
  .tool-panel iframe { flex: 1; width: 100%; height: 100%; min-height: 640px; border: none; background: white; }
  .tool-panel-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.9rem; text-align: center; padding: 40px; }

  @media (max-width: 1180px) {
    .app-container { display: flex; flex-direction: column; align-items: center; }
    .main-content { min-height: auto; }
    .top-section { flex-direction: column; flex-basis: auto; height: auto; }
    .top-col-title, .top-col-guide { flex-basis: auto; width: 100%; }
  }
  @media (max-width: 900px) {
    .tool-layout { flex-direction: column; }
    .tool-list-container { order: 0; flex-basis: auto; width: 100%; }
    .tool-panel iframe { min-height: 520px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="main-content">
    <div class="top-section">
      <div class="top-col-title">
        <div class="title-icon">🧰</div>
        <h2 class="title-main">한글(HWPX)<br>간편도구 모음</h2>
        <span class="title-security-badge">🔒 100% 메모리 보안 처리</span>
      </div>

      <div class="top-col-guide">
        <div class="security-banner">
          <div class="security-banner-header">
            <strong>🔒 개인정보 유출 걱정 없음</strong>
          </div>
          <ul class="security-features">
            <li><span class="feat-icon">🌐</span><span><strong>외부 서버 전송 ZERO</strong> <span class="feat-desc">: 파일이 외부로 전송되지 않고 브라우저 안에서만 처리</span></span></li>
            <li><span class="feat-icon">🧩</span><span><strong>도구 모음</strong> <span class="feat-desc">: 오른쪽 목록에서 원하는 도구를 고르면 바로 왼쪽 화면에서 실행</span></span></li>
            <li><span class="feat-icon">➕</span><span><strong>계속 추가 예정</strong> <span class="feat-desc">: 한글 문서 작업을 도와주는 도구를 이곳에 하나씩 더해갈 예정</span></span></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="tool-layout">
      <div class="tool-list-container" id="tool-list">
        <h3 class="tool-list-title">🧰 도구 목록</h3>
        <p class="tool-list-hint">도구를 클릭하면 왼쪽 화면에서 바로 실행됩니다.</p>
        <!-- 도구 항목들은 TOOLS 배열로부터 스크립트가 자동 생성합니다 -->
        <div id="tool-items"></div>
        <div class="tool-item-placeholder">➕ 더 많은 도구가 곧 추가될 예정입니다.</div>
      </div>

      <div class="tool-panel" id="tool-panel">
        <div class="tool-panel-empty" id="tool-panel-empty">오른쪽 목록에서 도구를 선택하세요.</div>
        <iframe id="tool-frame" style="display:none;" allow="local-fonts"></iframe>
      </div>
    </div>
  </div>
</div>

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

const toolItemsEl = document.getElementById("tool-items");
const frameEl = document.getElementById("tool-frame");
const emptyEl = document.getElementById("tool-panel-empty");

let activeId = null;

const CATEGORIES = [
  { id: "edit", label: "✏️ 문서 편집 도구" },
  { id: "form", label: "🎨 서식 만들기 도구" },
];

function renderList() {
  toolItemsEl.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const tools = TOOLS.filter(t => (t.category || "edit") === cat.id);
    if (!tools.length) return;
    const head = document.createElement("div");
    head.className = "tool-cat-title";
    head.textContent = cat.label;
    toolItemsEl.appendChild(head);
    tools.forEach(tool => {
      const item = document.createElement("div");
      item.className = "tool-item" + (tool.id === activeId ? " active" : "");
      item.innerHTML =
        '<span class="tool-icon">' + tool.icon + '</span>' +
        '<span class="tool-info">' +
          '<span class="tool-name">' + tool.name + '</span>' +
        '</span>';
      item.title = tool.desc;
      item.addEventListener("click", () => openTool(tool.id));
      toolItemsEl.appendChild(item);
    });
  });
}

function openTool(id) {
  const tool = TOOLS.find(t => t.id === id);
  if (!tool) return;
  activeId = id;
  renderList();
  const html = b64ToUtf8(tool.b64);
  frameEl.srcdoc = html;
  frameEl.style.display = "block";
  emptyEl.style.display = "none";
}

renderList();
// 처음에는 목록의 첫 번째 도구를 바로 열어 보여줍니다.
if (TOOLS.length > 0) openTool(TOOLS[0].id);
</script>
